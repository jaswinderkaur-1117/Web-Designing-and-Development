<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptive List in HTML</title>
</head>
<body>
    <h2>Descriptive List in HTML</h2>
    <p>A descriptive list is a list of terms and their descriptions.</p>
    <dl>
        <dt>First Term</dt>
        <dd>This is the description for the first term.</dd>
        <dt>Second Term</dt>
        <dd>This is the description for the second term.</dd>
        <dt>Third Term</dt>
        <dd>This is the description for the third term.</dd>
    </dl>
</body>
</html>
