<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Attributes in HTML</title>
</head>
<body>
    <h2>Table Attributes in HTML</h2>
    <p>HTML tables can have various attributes to control their appearance and behavior.</p>

    <table border="1" align="center"  height="100" width="40%" cellpadding="15" cellspacing="10" bordercolor="blue">
        <caption><b>Student Records</b></caption>
        <tr>
            <th bgcolor="plum">Student ID</th>
            <th bgcolor="plum">Student Name</th>
            <th bgcolor="plum">Grade</th>
        </tr>
        <tr>
            <td bgcolor="salmon">794934</td>
            <td bgcolor="salmon">John Doe</td>
            <td bgcolor="salmon">A</td>
        </tr>
        <tr>
            <td bgcolor="coral">802156</td>
            <td bgcolor="coral">Jane Smith</td>
            <td bgcolor="coral">B</td>
        </tr>

        <tr>
            <td bgcolor="limegreen">812345</td>
            <td bgcolor="limegreen">Emily Johnson</td>
            <td bgcolor="limegreen">A+</td>
        </tr>

        <tr>
            <td bgcolor="mediumpurple">823456</td>
            <td bgcolor="mediumpurple">Michael Brown</td>
            <td bgcolor="mediumpurple">C</td>
        </tr>

    </table>

    <hr width="100%" size="3" color="black">

    
</body>
</html>
