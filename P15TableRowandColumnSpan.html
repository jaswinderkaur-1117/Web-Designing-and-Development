<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Rowspan and Columnspan</title>
</head>
<body>
    <table border="1" align="center" style="border-collapse: collapse;" cellpadding="10" cellspacing="0" width="50%">
        <br>
        <caption><b>Table with Rowspan and Colspan</b></caption>

        <tr>
            <th colspan="2" bgcolor="salmon">Name</th>
            <th bgcolor="salmon">Class</th>
            <th bgcolor="salmon">School</th>
        </tr>

        <tr>
            <td rowspan="2" bgcolor="springgreen">Alice</td>
            <td rowspan="2" bgcolor="springgreen">Brown</td>
            <td bgcolor="springgreen">11</td>
            <td rowspan="2" bgcolor="springgreen">MVM School</td>
        </tr>

        <tr>
            <td bgcolor="springgreen">A</td>
        </tr>

        <tr>
            <td rowspan="2" bgcolor="turquoise">Bob</td>
            <td rowspan="2" bgcolor="turquoise">Smith</td>
            <td bgcolor="turquoise">12</td>
            <td rowspan="2" bgcolor="turquoise">LMS School</td>
        </tr>

        <tr>
            <td bgcolor="turquoise">B</td>
        </tr>

        <tr>
            <td rowspan="2" bgcolor="teal">Charlie</td>
            <td rowspan="2" bgcolor="teal">Johnson</td>
            <td bgcolor="teal">13</td>
            <td rowspan="2" bgcolor="teal">SCPM School</td>
        </tr>

        <tr>
            <td bgcolor="teal">A</td>
        </tr>

    </table>

    <br> <br>

    <table border="1" align="center" style="border-collapse: collapse;" cellpadding="10" cellspacing="0" width="60%">
        <caption><b>Student Information</b></caption>

        <tr>
            <th colspan="2" bgcolor="steelblue">Name</th>
            <th bgcolor="steelblue">Class</th>
            <th bgcolor="steelblue">Roll Number</th>
        </tr>

        <tr>
            <td bgcolor="springgreen">Sumit</td>
            <td bgcolor="springgreen">BCA</td>
            <td bgcolor="springgreen">4435</td>
        </tr>

        <tr>
            <td bgcolor="teal">Mohit</td>
            <td rowspan="3" bgcolor="teal">BBA</td>
            <td bgcolor="teal">7735</td>
        </tr>

        <tr>
            <td bgcolor="violet">Tarun</td>
            <td bgcolor="violet">MCA</td>
            <td bgcolor="violet">9435</td>
        </tr>

        <tr>
            <td bgcolor="thistle">Paras</td>
            <td bgcolor="thistle">MBA</td>
            <td bgcolor="thistle">9935</td>
        </tr>

    </table>
</body>
</html>
