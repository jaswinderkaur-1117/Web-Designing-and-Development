<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input in HTML</title>
</head>
<body>
    <h2>Form Input in HTML</h2>
    <p>HTML forms are used to collect user input. The input element is used to create various types of input fields.</p>

    <form action="/submit" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required maxlength="20"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="100"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="url">Linkedin Profile:</label>
        <input type="url" id="url" name="url"><br><br>

        <label for="datetime">Appointment Date and Time:</label>
        <input type="datetime-local" id="datetime" name="datetime"><br><br>

        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color"><br><br>

        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0" max="100"><br><br>

        <label for="checkbox">Subscribe to Newsletter:</label>
        <input type="checkbox" id="checkbox" name="checkbox" checked><br><br>

        <label for="hobbies">Hobbies:</label><br>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading">
        <label for="hobby1">Reading</label><br>
        <input type="checkbox" id="hobby2" name="hobbies" value="traveling">
        <label for="hobby2">Traveling</label><br>
        <input type="checkbox" id="hobby3" name="hobbies" value="gaming">
        <label for="hobby3">Gaming</label><br><br>

        <label for="language">Programming Language:</label><br>
        <input type="radio" id="language1" name="language" value="python">
        <label for="language1">Python</label><br>
        <input type="radio" id="language2" name="language" value="javascript">
        <label for="language2">JavaScript</label><br>
        <input type="radio" id="language3" name="language" value="java">
        <label for="language3">Java</label><br><br>

        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file"><br><br>

        <label for="file">Passport Photo:</label>
        <input type="file" id="file" name="file" accept="image/*"><br><br>

        <label for="file">Resume:</label>
        <input type="file" id="file" name="file" accept=".pdf,.doc,.docx"><br><br>


        <input type="submit" value="Submit">
    </form>
</body>
</html>
