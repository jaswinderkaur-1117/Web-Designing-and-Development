<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Break and Horizontal Rule</title>
</head>
<body>
    <h3 align="center">Line Break and Horizontal Rule</h3>
    <p align="center">This is a paragraph with a line break.<br>This is the second line.</p>
    <hr align="center" width="80%" size="2" color="black">

    <p align="center">This is another paragraph.</p>
    <p align="center">This is a third paragraph.</p>
</body>
</html>
