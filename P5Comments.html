<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments in HTML</title>
</head>
<body>
    <h2>Comments in HTML</h2>
    <p>Comments are not displayed in the browser.</p>
    <p>They are used to explain the code and make it more readable.</p>
    <!-- This is a comment -->
    <p>This is a paragraph.</p>
    <!-- Another comment -->
    <p>This is another paragraph.</p>
</body>
</html>
