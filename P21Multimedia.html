<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia in HTML</title>
</head>
<body>
    <h2>Multimedia in HTML</h2>
    <p>HTML allows you to embed multimedia content such as images, audio, and video into your web pages.</p>

    <audio controls>
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <video width="320" height="240" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>


    <!-- Youtube video -->
    <br><br>
    <iframe width="320" height="240" src="https://www.youtube.com/embed/yCjJyiqpAuU" allowfullscreen></iframe>

</body>
</html>
